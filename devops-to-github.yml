# DevOps -> GitHub mirror
# Manual trigger only. Run it to push the current DevOps main to GitHub.
# Netlify deploys from GitHub.

trigger:
- none

pool:
  name: MyHost-Local

steps:
- checkout: self
  fetchDepth: 0
  persistCredentials: true

- script: |
    git config --global user.email "azdo-mirror@users.noreply.github.com"
    git config --global user.name "AZDO Mirror"
    git remote remove github 2>nul
    git remote add github https://$(GITHUB_TOKEN)@github.com/ESAditya1729/DeepSight.git
    git push github HEAD:main
  displayName: 'Push DevOps main to GitHub'
  env:
    GITHUB_TOKEN: $(GITHUB_TOKEN)
